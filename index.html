<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: 키보드 등장 시 레이아웃(100dvh)도 같이 줄어 인풋이 부드럽게 키보드 위로(튐 방지) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 웹뷰 진입 시 첫 페인트를 라이트로 → 흑백 플래시 완화(네이티브 pre-paint 검정은 Flutter에서 별도 처리) -->
    <meta name="theme-color" content="#FFFFFF" />
    <style>
      html, body, #root { margin: 0; background: #FFFFFF; }
    </style>
    <title>FOX PAY · 금융친구</title>
    <!-- Pretendard 폰트. 사내망에서 CDN이 막히면 npm 'pretendard' 패키지로 교체하세요. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
